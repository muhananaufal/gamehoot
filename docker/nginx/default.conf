# Service web (A8): nginx in front of php-fpm. TLS ends at the host's reverse proxy (Caddy or
# nginx on the VM), which forwards to this container and to reverb; see chapter 15.
server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # K7: the same limit as post_max_size in docker/php/conf.d/pentahoot.ini.
    client_max_body_size 10m;

    server_tokens off;
    charset utf-8;

    # A3: the join page and its name list go to hundreds of phones at once.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv;

    # Health check of this container only (Dockerfile HEALTHCHECK).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built assets carry a content hash in their name.
    location /build/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # F16: public question images are files on the media volume (public/media links there);
    # anything else under /media/ is the signed route for private images, so it goes to Laravel.
    location /media/ {
        expires 1h;
        try_files $uri @laravel;
    }

    # F16: private images, only after Laravel checked the signed URL (MEDIA_ACCEL=true).
    location /_media/ {
        internal;
        alias /var/www/html/storage/app/media/;
    }

    location / {
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        # Docker's DNS, asked again every 10 s: a deploy replaces the app container and its
        # address may change, while this container keeps running.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # No other PHP file is ever run, and dotfiles are never served.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
