; php-fpm pool for production (service app). The container runs as www-data, so the pool
; user settings are not needed.
[www]
pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 1000
; Health check (cgi-fcgi in the Dockerfile).
ping.path = /ping
; Logs of slow requests help find what holds workers during an event.
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
