; K7: keep these limits in sync with the Laravel upload rules and nginx client_max_body_size.
; One question upload sends up to four images (question and answer, 1920 px and 720 px),
; each at most 2 MB after browser-side resizing (E8, E14).
upload_max_filesize = 2M
post_max_size = 10M
max_file_uploads = 4

memory_limit = 256M
expose_php = Off

date.timezone = UTC
