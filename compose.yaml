# Local development (O9). The database is not a container: the app connects to the
# MySQL server already running on this machine (A9), reached through host-gateway.
services:
  app:
    build:
      context: .
      target: dev
    image: pentahoot-php:dev
    working_dir: /var/www/html
    volumes:
      - ${PROJECT_PATH:-.}:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8000:8000"

  # Vite dev server. Node runs in a container so native packages (Tailwind, Rollup)
  # match CI and the production image build (6a).
  node:
    image: node:24.15.0-alpine3.23
    working_dir: /app
    volumes:
      - ${PROJECT_PATH:-.}:/app
    command: ["npm", "run", "dev"]
    ports:
      - "5173:5173"
