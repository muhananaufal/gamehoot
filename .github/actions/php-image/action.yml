name: PHP image
description: Builds a project PHP image target and installs Composer dependencies inside it.

inputs:
  target:
    description: Dockerfile target, "dev" or "browser".
    default: dev

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build PHP image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: ${{ inputs.target }}
        load: true
        tags: pentahoot-php:ci
        cache-from: type=gha,scope=php-${{ inputs.target }}
        cache-to: type=gha,scope=php-${{ inputs.target }},mode=max

    - name: Cache vendor
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: vendor-${{ hashFiles('composer.lock', 'Dockerfile') }}

    - name: Install Composer dependencies
      shell: bash
      run: >-
        docker run --rm -v "$PWD:/var/www/html" pentahoot-php:ci
        composer install --no-interaction --no-progress --prefer-dist
