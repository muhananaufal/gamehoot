name: PHP image
description: Builds the project PHP image (dev target) and installs Composer dependencies inside it.

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Build PHP image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        target: dev
        load: true
        tags: pentahoot-php:ci
        cache-from: type=gha,scope=php-dev
        cache-to: type=gha,scope=php-dev,mode=max

    - name: Cache vendor
      uses: actions/cache@v6.1.0
      with:
        path: vendor
        key: vendor-${{ hashFiles('composer.lock', 'Dockerfile') }}

    - name: Install Composer dependencies
      shell: bash
      run: >-
        docker run --rm -v "$PWD:/var/www/html" pentahoot-php:ci
        composer install --no-interaction --no-progress --prefer-dist
