# P3: once a week, vulnerabilities published after the last gate in the locked Composer and npm
# runtime packages. Runs in the gate repository only (GATE_ROLE=gate, W18), so origin spends no
# minutes on it; images are scanned whenever they are built (ci.yml). A failed run is the alert;
# GitHub notifies by email.
name: Security scan

on:
  schedule:
    # Monday 02:17 UTC (09:17 in Jakarta), away from the full hour when scheduled runs pile up.
    - cron: '17 2 * * 1'
  workflow_dispatch:

concurrency:
  group: security-scan
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Weekly dependency audit
    if: ${{ vars.GATE_ROLE == 'gate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit Composer packages
        run: docker run --rm -v "$PWD:/app" -w /app composer:2.10.3 audit --locked
      - name: Audit npm runtime packages
        run: docker run --rm -v "$PWD:/app" -w /app "node:$(cat .nvmrc)-bookworm-slim" npm audit --omit=dev --audit-level=high
