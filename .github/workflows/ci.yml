# W18, P6: the full gate runs in the gate repository (repository variable GATE_ROLE=gate) when
# scripts/gate-and-merge.sh pushes a gate/<branch> ref there. Origin runs no CI on push. Version
# tags and staging deploys on request check the Gate-* trailers (gate-trailer.sh), then build,
# push and scan the images and deploy them (P1, P4). A missing or stale trailer stops the image
# job; the full gate then runs on origin by hand:
#   gh workflow run ci.yml --ref <tag or develop> -f gate=true [-f deploy=staging]
# Pull requests (W2) run the full gate on origin when opened ready, marked ready, or labelled
# "gate". PHP comes from the project image (6a), MySQL is 8.4 (A9, W13).
name: CI

on:
  push:
    branches: ['gate/**']
    tags: ['v*']
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy staging (run on develop)
        type: choice
        options: [none, staging]
        default: none
      gate:
        description: Run the full gate in this run (fallback when the trailers do not match)
        type: boolean
        default: false

concurrency:
  # A newer push or pull request update cancels the older gate; tags and deploys never.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.deploy != 'staging' }}

permissions:
  contents: read

jobs:
  php:
    name: PHP (Pint, Larastan, audit, Pest, mutation)
    if: ${{ (vars.GATE_ROLE == 'gate' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/gate/'))) || (github.event_name == 'workflow_dispatch' && inputs.gate) || (github.event_name == 'pull_request' && !github.event.pull_request.draft && (contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'gate') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'gate')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: pentahoot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/php-image
        with:
          push: ${{ vars.GATE_ROLE == 'gate' }}
      - name: Check formatting (Pint)
        run: docker run --rm -v "$PWD:/var/www/html" pentahoot-php:ci vendor/bin/pint --test
      - name: Analyse (Larastan)
        run: docker run --rm -v "$PWD:/var/www/html" pentahoot-php:ci vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Audit dependencies
        run: docker run --rm -v "$PWD:/var/www/html" pentahoot-php:ci composer audit
      - name: Run test suite (MySQL 8.4)
        run: |
          cp .env.example .env
          app_key="base64:$(openssl rand -base64 32)"
          docker run --rm --network host -v "$PWD:/var/www/html" -e APP_KEY="$app_key" -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_USERNAME=root -e DB_PASSWORD=ci-only-root pentahoot-php:ci php artisan test --display-warnings
      - name: Mutation test of the core rules (K2)
        # E1 CompetitionRanking, E3 VoteWindow, E5 AnswerBoxes, E10 Leaderboard. Measured 89.47%
        # with --parallel (10 of 95 mutations survive); the score moves a little with timing, so
        # --min keeps a margin. Raise it once the surviving mutations are tested.
        run: |
          docker run --rm --network host -v "$PWD:/var/www/html" -e APP_KEY="base64:$(openssl rand -base64 32)" -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_USERNAME=root -e DB_PASSWORD=ci-only-root pentahoot-php:ci php -d pcov.enabled=1 vendor/bin/pest tests/Unit/Games --mutate --everything --covered-only --parallel --min=85 --class='App\Games\Pentahoot\CompetitionRanking,App\Games\Pentahoot\VoteWindow,App\Games\TebakKata\AnswerBoxes,App\Games\Tebak\Leaderboard'

  browser:
    # One job for both browsers: the image and asset setup is paid once (P6). Safari still runs
    # when Chrome fails. Not parallel: WebKit workers time out on a 2-core runner (P6).
    name: Pest browser (Chrome, Safari)
    if: ${{ (vars.GATE_ROLE == 'gate' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/gate/'))) || (github.event_name == 'workflow_dispatch' && inputs.gate) || (github.event_name == 'pull_request' && !github.event.pull_request.draft && (contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'gate') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'gate')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: pentahoot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/php-image
        with:
          target: browser
          push: ${{ vars.GATE_ROLE == 'gate' }}
      - name: Install packages and build assets
        run: |
          docker run --rm -v "$PWD:/app" -w /app "node:$(cat .nvmrc)-bookworm-slim" sh -c 'npm ci --no-audit --no-fund && npm run build'
          cp .env.example .env
      - name: Run browser tests in Chrome (W11)
        # storage:link serves the public question images under /media (F16).
        run: |
          docker run --rm --network host -v "$PWD:/var/www/html" -e APP_KEY="base64:$(openssl rand -base64 32)" -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_USERNAME=root -e DB_PASSWORD=ci-only-root pentahoot-php:ci sh -c "php artisan storage:link --force > /dev/null && php artisan test --testsuite=Browser --browser chrome"
      - name: Run browser tests in Safari (W11)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --network host -v "$PWD:/var/www/html" -e APP_KEY="base64:$(openssl rand -base64 32)" -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_USERNAME=root -e DB_PASSWORD=ci-only-root pentahoot-php:ci sh -c "php artisan storage:link --force > /dev/null && php artisan test --testsuite=Browser --browser safari"
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          retention-days: 3

  checks:
    # P3, W10, W14, W15, W16: frontend checks, secrets in the history, workflow lint and the
    # repository rules, in one job so the checkout is paid once.
    name: Frontend, Gitleaks, workflow lint, repo rules
    if: ${{ (vars.GATE_ROLE == 'gate' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/gate/'))) || (github.event_name == 'workflow_dispatch' && inputs.gate) || (github.event_name == 'pull_request' && !github.event.pull_request.draft && (contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'gate') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'gate')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ESLint, Prettier, Vitest, build
        run: |
          docker run --rm -v "$PWD:/app" -w /app "node:$(cat .nvmrc)-bookworm-slim" sh -c '
            npm ci --no-audit --no-fund &&
            npx eslint . &&
            npx prettier --check resources/js tests/js "*.config.js" &&
            npx vitest run &&
            npm run build
          '
      - name: Scan history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git --redact --no-banner /repo
      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Audit workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.30.1 --config .github/zizmor.yml --min-severity=low .github
      - name: Repository rules (W10, W14, W15, W18)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bash .github/scripts/repo-rules.test.sh
          bash .github/scripts/gate-trailer.test.sh
          bash scripts/gate-and-merge.test.sh
          bash deploy/deploy.test.sh
          bash scripts/ci-report.test.sh
          if [ -n "$PR_BASE" ]; then
            # W2: a pull request must contain the newest base commit, so the merge is what was tested.
            if ! git merge-base --is-ancestor "$PR_BASE" "$PR_HEAD"; then
              echo "::error::The branch is behind its base. Update it (rebase) before merging."
              exit 1
            fi
            base="$PR_BASE"; head="$PR_HEAD"
          elif git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            # A gate ref is the merge that gate-and-merge.sh made: check what it brings in.
            base="$(git rev-parse 'HEAD^1')"; head=HEAD
          else
            base="$(git merge-base origin/develop HEAD 2> /dev/null || true)"; head=HEAD
          fi
          if [ -z "$base" ]; then
            echo "No earlier commit to compare with; nothing to check."
            exit 0
          fi
          bash .github/scripts/repo-rules.sh "$base" "$head"

  proof:
    # P1, P2, P3: every gate proves that the production images build and pass Trivy. Nothing is
    # pushed except the build cache, which the gate repository keeps in its own registry.
    name: Production images (proof)
    if: ${{ (vars.GATE_ROLE == 'gate' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/gate/'))) || (github.event_name == 'pull_request' && !github.event.pull_request.draft && (contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'gate') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'gate')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      CACHE: ghcr.io/${{ github.repository_owner }}/pentahoot-ci:cache-production
      USE_CACHE: ${{ vars.GATE_ROLE == 'gate' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          tags: pentahoot-app:proof
          cache-from: ${{ env.USE_CACHE == 'true' && format('type=registry,ref={0}', env.CACHE) || '' }}
          cache-to: ${{ env.USE_CACHE == 'true' && format('type=registry,ref={0},mode=max,ignore-error=true', env.CACHE) || '' }}
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: pentahoot-web:proof
      - name: Scan images (Trivy)
        # One vulnerability database download for both images (A3).
        run: |
          for image in pentahoot-app:proof pentahoot-web:proof; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache aquasec/trivy:0.74.0 image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

  image:
    # P1, P3, P4: origin builds the images only to deploy them, pushes them with provenance and an
    # SBOM, and scans the pushed digests. W18: only for a tree that passed the gate (Gate-* trailers),
    # or after the full gate ran in this same run.
    name: Production images
    needs: [php, browser, checks]
    if: ${{ !cancelled() && vars.GATE_ROLE != 'gate' && ((startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_DEPLOY == 'on') || (github.event_name == 'workflow_dispatch' && inputs.deploy == 'staging' && github.ref == 'refs/heads/develop' && vars.STAGING_DEPLOY == 'on')) && needs.php.result != 'failure' && needs.browser.result != 'failure' && needs.checks.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      REPO: ghcr.io/${{ github.repository_owner }}/pentahoot
      FULL_GATE: ${{ needs.php.result == 'success' && needs.browser.result == 'success' && needs.checks.result == 'success' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      app_digest: ${{ steps.app.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the gate (W18)
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ "$FULL_GATE" = true ]; then
            echo "The full gate ran and passed in this run."
            exit 0
          fi
          verdict="$(bash .github/scripts/gate-trailer.sh HEAD)"
          if [ "$verdict" != gated=true ]; then
            echo "::error::No gate trailer for this tree. Merge with scripts/gate-and-merge.sh, or run the full gate here: gh workflow run ci.yml --ref $GITHUB_REF_NAME -f gate=true"
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tag
        run: |
          tag="${GITHUB_SHA::12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          for name in app web; do
            repo="$REPO"
            if [ "$name" = web ]; then repo="$REPO-web"; fi
            {
              echo "$name<<TAGS"
              echo "$repo:$tag"
              if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "$repo:$GITHUB_REF_NAME"; fi
              echo "TAGS"
            } >> "$GITHUB_OUTPUT"
          done
          # P1: a version gets the newest OS patches; a staging build reuses the cached layers.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then refresh="$GITHUB_RUN_ID"; else refresh=staging; fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
      - name: Publish app image with provenance and SBOM
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tag.outputs.app }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max
          build-args: APT_REFRESH=${{ steps.tag.outputs.refresh }}
      - name: Publish web image with provenance and SBOM
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tag.outputs.web }}
          cache-from: type=gha,scope=production
          build-args: APT_REFRESH=${{ steps.tag.outputs.refresh }}
      - name: Scan the published images by digest (Trivy)
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          for image in "$REPO@$APP_DIGEST" "$REPO-web@$WEB_DIGEST"; do
            docker pull --quiet "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache aquasec/trivy:0.74.0 image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

  deploy-staging:
    # O2, P4: staging deploys on request from develop, once the image job is green.
    name: Deploy staging
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.deploy == 'staging' && github.ref == 'refs/heads/develop' && vars.STAGING_DEPLOY == 'on' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_DIGEST: ${{ needs.image.outputs.app_digest }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          TAG: ${{ needs.image.outputs.tag }}
        run: bash deploy/remote.sh

  deploy-production:
    # O2, P5: a version tag on main deploys production after a manual approval of the production
    # environment in GitHub. Never during an event.
    name: Deploy production
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_DEPLOY == 'on' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_DIGEST: ${{ needs.image.outputs.app_digest }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          TAG: ${{ github.ref_name }}
        run: bash deploy/remote.sh
