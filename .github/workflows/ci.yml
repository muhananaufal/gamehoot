# W18, P6, P11: the full gate runs where scripts/gate-and-merge.sh pushes a gate/<branch> ref: on
# origin on the office runner (repository variable GATE_RUNNER=self-hosted; the default), or in
# the gate repository (GATE_ROLE=gate; --gate mirror). Gate jobs isolate themselves on the shared
# runner with ci-sandbox.sh. Origin runs no other CI on push. Version tags and staging deploys on
# request check the Gate-* trailers (gate-trailer.sh) or a green gate of the same tree on origin
# (gate-run.sh, for pull requests merged with the Merge button), then build, push and scan the
# images and deploy them (P1, P4). Without either the image job stops; the full gate then runs on
# origin by hand:
#   gh workflow run ci.yml --ref <tag or develop> -f gate=true [-f deploy=staging]
# Pull requests (W2) run the full gate on origin when opened ready, marked ready, or labelled
# "gate". O2: with the repository variable STAGING_AUTO=on, every push to develop deploys staging
# too; while it is off, a develop push runs no job. PHP comes from the project image (6a), MySQL
# is 8.4 (A9, W13).
name: CI

on:
  push:
    branches: ['gate/**', develop]
    tags: ['v*']
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy staging (run on develop)
        type: choice
        options: [none, staging]
        default: none
      gate:
        description: Run the full gate in this run (fallback when the trailers do not match)
        type: boolean
        default: false
      runner:
        description: Runner of the image and deploy jobs (P10); scripts/deploy.sh picks github when the office runner is down
        type: choice
        options: [office, github]
        default: office

concurrency:
  # A newer push or pull request update cancels the older gate; tags and deploys never.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/develop' && inputs.deploy != 'staging' }}

permissions:
  contents: read

jobs:
  php:
    name: PHP (Pint, Larastan, audit, Pest, mutation)
    if: &gate_jobs_if ${{ (vars.GATE_ROLE == 'gate' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/gate/'))) || (vars.GATE_RUNNER != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/gate/')) || (github.event_name == 'workflow_dispatch' && inputs.gate) || (github.event_name == 'pull_request' && !github.event.pull_request.draft && (contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'gate') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'gate')))) }}
    runs-on: &gate_runner ${{ inputs.runner == 'github' && 'ubuntu-24.04' || vars.GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Own Docker network, names and limits (P11)
        run: bash .github/scripts/ci-sandbox.sh setup
      - name: Start MySQL in the background
        run: bash .github/scripts/ci-mysql.sh start
      - uses: ./.github/actions/php-image
        with:
          tag: ${{ env.CI_PHP }}
          push: ${{ vars.GATE_ROLE == 'gate' || vars.GATE_RUNNER != '' }}
      - name: Check formatting (Pint)
        run: bash .github/scripts/ci-run.sh php vendor/bin/pint --test
      - name: Analyse (Larastan)
        run: bash .github/scripts/ci-run.sh php vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Audit dependencies
        run: bash .github/scripts/ci-run.sh php composer audit
      - name: Wait for MySQL
        run: bash .github/scripts/ci-mysql.sh wait
      - name: Run test suite (MySQL 8.4)
        run: |
          cp .env.example .env
          bash .github/scripts/ci-run.sh php-db php artisan test --display-warnings
      - name: Mutation test of the core rules (K2)
        # E1 CompetitionRanking, E3 VoteWindow, E5 AnswerBoxes, E10 Leaderboard. Measured 89.47%
        # with --parallel (10 of 95 mutations survive); the score moves a little with timing, so
        # --min keeps a margin. Raise it once the surviving mutations are tested.
        run: |
          bash .github/scripts/ci-run.sh php-db php -d pcov.enabled=1 vendor/bin/pest tests/Unit/Games --mutate --everything --covered-only --parallel --min=85 --class='App\Games\Pentahoot\CompetitionRanking,App\Games\Pentahoot\VoteWindow,App\Games\TebakKata\AnswerBoxes,App\Games\Tebak\Leaderboard'
      - name: Remove this job's containers, network and images (P11)
        if: ${{ always() }}
        run: bash .github/scripts/ci-sandbox.sh cleanup

  browser:
    # One job for both browsers: the image and asset setup is paid once (P6). Safari still runs
    # when Chrome fails. Not parallel: WebKit workers time out on a 2-core runner (P6).
    name: Pest browser (Chrome, Safari)
    if: *gate_jobs_if
    runs-on: *gate_runner
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Own Docker network, names and limits (P11)
        run: bash .github/scripts/ci-sandbox.sh setup
      - name: Start MySQL in the background
        run: bash .github/scripts/ci-mysql.sh start
      - uses: ./.github/actions/php-image
        with:
          target: browser
          tag: ${{ env.CI_PHP }}
          push: ${{ vars.GATE_ROLE == 'gate' || vars.GATE_RUNNER != '' }}
      - name: Install packages and build assets
        run: |
          bash .github/scripts/ci-run.sh node sh -c 'npm ci --no-audit --no-fund && npm run build'
          cp .env.example .env
      - name: Wait for MySQL
        run: bash .github/scripts/ci-mysql.sh wait
      - name: Run browser tests in Chrome (W11)
        # storage:link serves the public question images under /media (F16).
        run: |
          bash .github/scripts/ci-run.sh php-db sh -c "php artisan storage:link --force > /dev/null && php artisan test --testsuite=Browser --browser chrome"
      - name: Set the Chrome screenshots aside
        # Every browser test run empties tests/Browser/Screenshots when it starts (the plugin's
        # Screenshot::cleanup), so the Safari run would delete the evidence of a Chrome failure.
        if: ${{ !cancelled() }}
        run: |
          mkdir -p browser-screenshots/chrome
          cp -r tests/Browser/Screenshots/. browser-screenshots/chrome/ 2> /dev/null || true
      - name: Run browser tests in Safari (W11)
        if: ${{ !cancelled() }}
        run: |
          bash .github/scripts/ci-run.sh php-db sh -c "php artisan storage:link --force > /dev/null && php artisan test --testsuite=Browser --browser safari"
      - name: Set the Safari screenshots aside
        if: ${{ !cancelled() }}
        run: |
          mkdir -p browser-screenshots/safari
          cp -r tests/Browser/Screenshots/. browser-screenshots/safari/ 2> /dev/null || true
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: browser-screenshots
          retention-days: 3
      - name: Remove this job's containers, network and images (P11)
        if: ${{ always() }}
        run: bash .github/scripts/ci-sandbox.sh cleanup

  checks:
    # P1, P2, P3, W10, W14, W15, W16: the production image proof, frontend checks, secrets in the
    # history, workflow lint and the repository rules, in one job so the setup and the per-job
    # minute rounding are paid once (P6). Each check runs even when an earlier one failed.
    name: Production image proof, frontend, Gitleaks, workflow lint, repo rules
    if: *gate_jobs_if
    runs-on: *gate_runner
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      # The proof runs in the gate repository and on pull requests; the origin fallback gate
      # skips it because the image job builds the real images right after.
      PROOF: ${{ vars.GATE_ROLE == 'gate' || vars.GATE_RUNNER != '' || github.event_name == 'pull_request' }}
      CACHE: ghcr.io/${{ github.repository_owner }}/pentahoot-ci:cache-production
      USE_CACHE: ${{ vars.GATE_ROLE == 'gate' || vars.GATE_RUNNER != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Own Docker network, names and limits (P11)
        run: bash .github/scripts/ci-sandbox.sh setup
      # The proof comes first, from the clean checkout: the frontend step below writes
      # public/build, which .dockerignore does not exclude.
      - name: Set up Docker Buildx
        if: env.PROOF == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        if: env.PROOF == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app image (proof)
        if: env.PROOF == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          tags: pentahoot-app:proof-${{ env.CI_ID }}
          cache-from: ${{ env.USE_CACHE == 'true' && format('type=registry,ref={0}', env.CACHE) || '' }}
          cache-to: ${{ env.USE_CACHE == 'true' && format('type=registry,ref={0},mode=max,ignore-error=true', env.CACHE) || '' }}
      - name: Build web image (proof)
        if: env.PROOF == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: pentahoot-web:proof-${{ env.CI_ID }}
      - name: Scan images (Trivy)
        # One vulnerability database download for both images (A3).
        if: env.PROOF == 'true'
        run: |
          for image in "pentahoot-app:proof-$CI_ID" "pentahoot-web:proof-$CI_ID"; do
            docker run --rm --label "pentahoot-ci=$CI_ID" -v /var/run/docker.sock:/var/run/docker.sock -v pentahoot-trivy-cache:/root/.cache aquasec/trivy:0.74.0 image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: ESLint, Prettier, Vitest, build, phone bundle budget (F27)
        if: ${{ !cancelled() }}
        run: |
          bash .github/scripts/ci-run.sh node sh -c '
            npm ci --no-audit --no-fund &&
            npx eslint . &&
            npx prettier --check resources/js tests/js scripts/load "*.config.js" &&
            npx vitest run &&
            npm run build &&
            node scripts/bundle-budget.mjs
          '
      - name: Scan history for secrets
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git --redact --no-banner /repo
      - name: Lint workflows (actionlint)
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Audit workflows (zizmor)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.30.1 --config .github/zizmor.yml --min-severity=low .github
      - name: Repository rules (W10, W14, W15, W18)
        if: ${{ !cancelled() }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bash .github/scripts/run-tests.sh
          if [ -n "$PR_BASE" ]; then
            # W2: a pull request must contain the newest base commit, so the merge is what was tested.
            if ! git merge-base --is-ancestor "$PR_BASE" "$PR_HEAD"; then
              echo "::error::The branch is behind its base. Update it (rebase) before merging."
              exit 1
            fi
            base="$PR_BASE"; head="$PR_HEAD"
          elif git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            # A gate ref is the merge that gate-and-merge.sh made: check what it brings in.
            base="$(git rev-parse 'HEAD^1')"; head=HEAD
          else
            base="$(git merge-base origin/develop HEAD 2> /dev/null || true)"; head=HEAD
          fi
          if [ -z "$base" ]; then
            echo "No earlier commit to compare with; nothing to check."
            exit 0
          fi
          bash .github/scripts/repo-rules.sh "$base" "$head"
      - name: Name the tested tree (P11, W2)
        id: tree
        if: ${{ success() && vars.GATE_ROLE != 'gate' }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/gate-tree"
      - name: Record the tested tree for deploys (P11, W2)
        # gate-run.sh lets a deploy of exactly this tree through when every gate job of this run passed.
        if: ${{ success() && vars.GATE_ROLE != 'gate' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/gate-tree
          retention-days: 30
      - name: Remove this job's containers, network and images (P11)
        if: ${{ always() }}
        run: bash .github/scripts/ci-sandbox.sh cleanup

  image:
    # P1, P3, P4: origin builds the images only to deploy them, pushes them with provenance and an
    # SBOM, and scans the pushed digests. W18: only for a tree that passed the gate (Gate-* trailers),
    # or after the full gate ran in this same run.
    name: Production images
    needs: [php, browser, checks]
    if: ${{ !cancelled() && vars.GATE_ROLE != 'gate' && ((startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_DEPLOY == 'on') || (github.ref == 'refs/heads/develop' && vars.STAGING_DEPLOY == 'on' && ((github.event_name == 'workflow_dispatch' && inputs.deploy == 'staging') || (github.event_name == 'push' && vars.STAGING_AUTO == 'on')))) && needs.php.result != 'failure' && needs.browser.result != 'failure' && needs.checks.result != 'failure' }}
    # P10: the office runner when DEPLOY_RUNNER=self-hosted; scripts/deploy.sh re-runs with runner=github when it does not answer.
    runs-on: &deploy_runner ${{ inputs.runner == 'github' && 'ubuntu-24.04' || vars.DEPLOY_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      REPO: ghcr.io/${{ github.repository_owner }}/pentahoot
      FULL_GATE: ${{ needs.php.result == 'success' && needs.browser.result == 'success' && needs.checks.result == 'success' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      app_digest: ${{ steps.promote.outputs.app_digest || steps.app.outputs.digest }}
      web_digest: ${{ steps.promote.outputs.web_digest || steps.web.outputs.digest }}
    steps:
      - name: Docker settings of this job only (P10)
        # The office runner shares one user and one ~/.docker with other teams' runners: a login,
        # its logout and the buildx builders stay in this job's own folder. The CLI plugins
        # (buildx, compose) are linked in, so they are found as before.
        run: |
          config="$RUNNER_TEMP/docker-config"
          mkdir -p "$config/cli-plugins"
          if [ -d "$HOME/.docker/cli-plugins" ]; then
            find "$HOME/.docker/cli-plugins" -maxdepth 1 -type f -exec ln -sf {} "$config/cli-plugins/" \;
          fi
          echo "DOCKER_CONFIG=$config" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the gate (W18, P11)
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$FULL_GATE" = true ]; then
            echo "The full gate ran and passed in this run."
            exit 0
          fi
          verdict="$(bash .github/scripts/gate-trailer.sh HEAD)"
          if [ "$verdict" != gated=true ]; then
            # A pull request merged with the Merge button: a green gate of this exact tree on origin.
            verdict="$(bash .github/scripts/gate-run.sh "$(git rev-parse 'HEAD^{tree}')")"
          fi
          if [ "$verdict" != gated=true ]; then
            echo "::error::No gate for this tree. Merge with scripts/gate-and-merge.sh or a gated pull request, or run the full gate here: gh workflow run ci.yml --ref $GITHUB_REF_NAME -f gate=true"
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tag
        run: |
          tag="${GITHUB_SHA::12}"
          week="$(date -u +%G-W%V)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          for name in app web; do
            repo="$REPO"
            if [ "$name" = web ]; then repo="$REPO-web"; fi
            {
              echo "$name<<TAGS"
              echo "$repo:$tag"
              # P1: a version tag, or the weekly tag that lets a version reuse this staging image.
              if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "$repo:$GITHUB_REF_NAME"; else echo "$repo:$tag-$week"; fi
              echo "TAGS"
            } >> "$GITHUB_OUTPUT"
          done
          # P1: a version gets the newest OS patches; a staging build refreshes them once a week
          # and otherwise reuses the cached layers.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then refresh="$GITHUB_RUN_ID"; else refresh="$week"; fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
      - name: Reuse the staging image of this code (P1)
        # A version tag, or a staging deploy whose code did not change, takes this week's staging
        # image of the same code instead of building one.
        id: promote
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.tag.outputs.tag }}
          ALSO_TAG: ${{ !startsWith(github.ref, 'refs/tags/v') && format('{0}-{1}', steps.tag.outputs.tag, steps.tag.outputs.week) || '' }}
        run: bash .github/scripts/promote-staging.sh >> "$GITHUB_OUTPUT"
      - name: Publish app image with provenance and SBOM
        id: app
        if: steps.promote.outputs.promoted != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tag.outputs.app }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max
          build-args: APT_REFRESH=${{ steps.tag.outputs.refresh }}
      - name: Publish web image with provenance and SBOM
        id: web
        if: steps.promote.outputs.promoted != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tag.outputs.web }}
          cache-from: type=gha,scope=production
          build-args: APT_REFRESH=${{ steps.tag.outputs.refresh }}
      - name: Scan the published images by digest (Trivy)
        env:
          APP_DIGEST: ${{ steps.promote.outputs.app_digest || steps.app.outputs.digest }}
          WEB_DIGEST: ${{ steps.promote.outputs.web_digest || steps.web.outputs.digest }}
        run: |
          # P10: the cache volume has its own name on the shared office runner.
          for image in "$REPO@$APP_DIGEST" "$REPO-web@$WEB_DIGEST"; do
            docker pull --quiet "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v pentahoot-trivy-cache:/root/.cache aquasec/trivy:0.74.0 image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Remove the images this job pulled (P10)
        # Only this job's own images: the office runner is a shared staging server, so no prune.
        if: ${{ always() }}
        env:
          APP_DIGEST: ${{ steps.promote.outputs.app_digest || steps.app.outputs.digest }}
          WEB_DIGEST: ${{ steps.promote.outputs.web_digest || steps.web.outputs.digest }}
        run: |
          for image in "$REPO@$APP_DIGEST" "$REPO-web@$WEB_DIGEST"; do
            case "$image" in *@sha256:*) docker image rm "$image" > /dev/null 2>&1 || true ;; esac
          done

  deploy-staging:
    # O2, P4: staging deploys from develop on request, or on every push with STAGING_AUTO=on,
    # once the image job is green.
    name: Deploy staging
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && github.ref == 'refs/heads/develop' && vars.STAGING_DEPLOY == 'on' && ((github.event_name == 'workflow_dispatch' && inputs.deploy == 'staging') || (github.event_name == 'push' && vars.STAGING_AUTO == 'on')) }}
    runs-on: *deploy_runner
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_DIGEST: ${{ needs.image.outputs.app_digest }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          TAG: ${{ needs.image.outputs.tag }}
        run: bash deploy/remote.sh

  deploy-production:
    # O2, P5: a version tag on main deploys production after a manual approval of the production
    # environment in GitHub. Never during an event.
    name: Deploy production
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_DEPLOY == 'on' }}
    runs-on: *deploy_runner
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_DIGEST: ${{ needs.image.outputs.app_digest }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          TAG: ${{ github.ref_name }}
        run: bash deploy/remote.sh
