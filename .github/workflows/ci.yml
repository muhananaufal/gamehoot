# O1, P6: tiered quality gate. Light checks on every push of a feature branch; the full gate
# (MySQL 8.0, browsers, production images) on develop, release/*, hotfix/* and version tags,
# and started by hand on a feature branch before merge (W18):
#   gh workflow run ci.yml --ref feature/<name>
# PHP comes from the project image (6a), MySQL from the versions production may run until O-B
# is answered (W13).
name: CI

on:
  push:
    # main only receives merges of release/* and hotfix/*, already tested; production deploys
    # from the version tag. Tags are listed because GitHub skips a ref type without a filter.
    branches-ignore: [main]
    tags: ['v*']
    # Documentation-only pushes run nothing. GitHub does not apply path filters to tags.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  # The event is part of the group, so a push never cancels a full gate started by hand.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # P6: a new push cancels the old run of a feature branch, but never a run that may be
  # deploying (develop, version tags).
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  reused:
    # W18: a version tag reuses the green full gate of the release/* or hotfix/* commit it
    # merges when the code is identical. Anything uncertain runs the full gate on the tag.
    name: Tested release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Look for the green full gate of the merged branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/tested-release.sh >> "$GITHUB_OUTPUT"

  php:
    # One job for the PHP checks: the image setup dominates each of them (P6).
    name: PHP
    needs: reused
    if: ${{ !cancelled() && needs.reused.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: pentahoot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/php-image
      - name: Check formatting (Pint)
        run: docker run --rm -v "$PWD:/var/www/html" pentahoot-php:ci vendor/bin/pint --test
      - name: Analyse (Larastan)
        run: docker run --rm -v "$PWD:/var/www/html" pentahoot-php:ci vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Audit dependencies
        run: docker run --rm -v "$PWD:/var/www/html" pentahoot-php:ci composer audit
      - name: Run test suite (MySQL 8.4)
        run: |
          cp .env.example .env
          app_key="base64:$(openssl rand -base64 32)"
          docker run --rm --network host -v "$PWD:/var/www/html" -e APP_KEY="$app_key" -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_USERNAME=root -e DB_PASSWORD=ci-only-root pentahoot-php:ci php artisan test --display-warnings

  frontend:
    name: ESLint, Prettier, Vitest, build
    needs: reused
    if: ${{ !cancelled() && needs.reused.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache npm
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-${{ hashFiles('package-lock.json', '.nvmrc') }}
      - name: Install, check and build
        run: |
          docker run --rm -v "$PWD:/app" -w /app -e npm_config_cache=/app/.npm-cache "node:$(cat .nvmrc)-bookworm-slim" sh -c '
            npm ci --no-audit --no-fund &&
            npx eslint . &&
            npx prettier --check resources/js tests/js "*.config.js" &&
            npx vitest run &&
            npm run build
          '

  secrets:
    # P3, W10, W14, W15: secrets in the history, workflow lint, and the repository rules that
    # the local hooks enforce, in one job so the checkout is paid once.
    name: Gitleaks, workflow lint, repo rules
    needs: reused
    if: ${{ !cancelled() && needs.reused.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git --redact --no-banner /repo
      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Audit workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.30.1 --config .github/zizmor.yml --min-severity=low .github
      - name: Repository rules (W10, W14, W15)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          bash .github/scripts/repo-rules.test.sh
          bash deploy/deploy.test.sh
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "A tag adds no commits of its own; its release branch was checked."
            exit 0
          fi
          if [ "$GITHUB_REF" = refs/heads/develop ]; then base="$BEFORE"; else base="$(git merge-base origin/develop HEAD)"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with (first push or manual run); nothing to check."
            exit 0
          fi
          bash .github/scripts/repo-rules.sh "$base" HEAD

  test:
    # Full gate only. The MySQL 8.0 run is dropped once the production MySQL version is known
    # (O-B); the mutation test (K2) then moves with this job.
    name: Pest (MySQL 8.0), mutation (K2)
    needs: reused
    if: ${{ !cancelled() && needs.reused.outputs.tested != 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: pentahoot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/php-image
      - name: Run test suite
        run: |
          cp .env.example .env
          app_key="base64:$(openssl rand -base64 32)"
          docker run --rm --network host -v "$PWD:/var/www/html" -e APP_KEY="$app_key" -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_USERNAME=root -e DB_PASSWORD=ci-only-root pentahoot-php:ci php artisan test --display-warnings
      - name: Mutation test of the core rules (K2)
        # E1 CompetitionRanking, E3 VoteWindow, E5 AnswerBoxes, E10 Leaderboard. Measured 89.47%
        # with --parallel (10 of 95 mutations survive); the score moves a little with timing, so
        # --min keeps a margin. Raise it once the surviving mutations are tested.
        run: |
          docker run --rm --network host -v "$PWD:/var/www/html" -e APP_KEY="base64:$(openssl rand -base64 32)" -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_USERNAME=root -e DB_PASSWORD=ci-only-root pentahoot-php:ci php -d pcov.enabled=1 vendor/bin/pest tests/Unit/Games --mutate --everything --covered-only --parallel --min=85 --class='App\Games\Pentahoot\CompetitionRanking,App\Games\Pentahoot\VoteWindow,App\Games\TebakKata\AnswerBoxes,App\Games\Tebak\Leaderboard'

  browser:
    # Full gate only. One job per browser: shards paid the image and asset setup twice (P6).
    name: Pest browser (${{ matrix.browser }})
    needs: reused
    if: ${{ !cancelled() && needs.reused.outputs.tested != 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, safari]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: pentahoot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/php-image
        with:
          target: browser
      - name: Cache npm
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .npm-cache
          key: npm-${{ hashFiles('package-lock.json', '.nvmrc') }}
      - name: Install packages and build assets
        run: |
          docker run --rm -v "$PWD:/app" -w /app -e npm_config_cache=/app/.npm-cache "node:$(cat .nvmrc)-bookworm-slim" sh -c 'npm ci --no-audit --no-fund && npm run build'
      - name: Run browser tests (W11)
        # storage:link serves the public question images under /media (F16).
        run: |
          cp .env.example .env
          app_key="base64:$(openssl rand -base64 32)"
          docker run --rm --network host -v "$PWD:/var/www/html" -e APP_KEY="$app_key" -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_USERNAME=root -e DB_PASSWORD=ci-only-root pentahoot-php:ci sh -c "php artisan storage:link && php artisan test --testsuite=Browser --browser ${{ matrix.browser }}"
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-screenshots-${{ matrix.browser }}
          path: tests/Browser/Screenshots

  image:
    # P1, P2, P3: the production images are built and scanned in every full gate, so a branch
    # proves them before merge; only develop and version tags push them to the registry. A tag
    # always builds its own images, also when it reuses the tests of its release branch.
    name: Production images
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Switched on per environment with the repository variables STAGING_DEPLOY and
      # PRODUCTION_DEPLOY (value on) once its server is ready (chapter 15).
      PUBLISH: ${{ (github.ref == 'refs/heads/develop' && vars.STAGING_DEPLOY == 'on') || (startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_DEPLOY == 'on') }}
      REPO: ghcr.io/${{ github.repository_owner }}/pentahoot
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      app_digest: ${{ steps.app.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          tags: ${{ env.REPO }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max
          build-args: APT_REFRESH=${{ github.run_id }}
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: ${{ env.REPO }}-web:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=production
          build-args: APT_REFRESH=${{ github.run_id }}
      - name: Scan images (Trivy)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for image in "$REPO:$TAG" "$REPO-web:$TAG"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      # P1, P2: published images carry provenance (mode=max) and an SBOM, which requires
      # pushing straight from the builder (a loaded image cannot hold attestations). The
      # builder still has the layers of the scanned build above, so this is a cached rebuild;
      # the pushed images are then pulled by digest and scanned again, and only those digests
      # are deployed (P4).
      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Registry tags
        id: tags
        if: env.PUBLISH == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for name in app web; do
            repo="$REPO"
            if [ "$name" = web ]; then repo="$REPO-web"; fi
            {
              echo "$name<<TAGS"
              echo "$repo:$TAG"
              if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "$repo:$GITHUB_REF_NAME"; fi
              echo "TAGS"
            } >> "$GITHUB_OUTPUT"
          done
      - name: Publish app image with provenance and SBOM
        id: app
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.app }}
          cache-from: type=gha,scope=production
          build-args: APT_REFRESH=${{ github.run_id }}
      - name: Publish web image with provenance and SBOM
        id: web
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha,scope=production
          build-args: APT_REFRESH=${{ github.run_id }}
      - name: Scan the published images by digest (Trivy)
        if: env.PUBLISH == 'true'
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          for image in "$REPO@$APP_DIGEST" "$REPO-web@$WEB_DIGEST"; do
            docker pull --quiet "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

  deploy-staging:
    # O2, P4: develop deploys staging once every check of the same push is green (W18). The
    # explicit status check keeps the job from inheriting the skipped "Tested release" job.
    name: Deploy staging
    needs: [php, frontend, secrets, test, browser, image]
    if: ${{ !cancelled() && github.ref == 'refs/heads/develop' && vars.STAGING_DEPLOY == 'on' && needs.php.result == 'success' && needs.frontend.result == 'success' && needs.secrets.result == 'success' && needs.test.result == 'success' && needs.browser.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_DIGEST: ${{ needs.image.outputs.app_digest }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          TAG: ${{ needs.image.outputs.tag }}
        run: bash deploy/remote.sh

  deploy-production:
    # O2, P5: a version tag on main deploys production after a manual approval of the
    # production environment in GitHub. Never during an event. The checks are either the
    # reused full gate of the release branch (W18) or the full gate run on the tag.
    name: Deploy production
    needs: [reused, php, frontend, secrets, test, browser, image]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_DEPLOY == 'on' && needs.image.result == 'success' && (needs.reused.outputs.tested == 'true' || (needs.php.result == 'success' && needs.frontend.result == 'success' && needs.secrets.result == 'success' && needs.test.result == 'success' && needs.browser.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_DIGEST: ${{ needs.image.outputs.app_digest }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          TAG: ${{ github.ref_name }}
        run: bash deploy/remote.sh
